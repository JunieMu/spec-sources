<!DOCTYPE html>

<html>
    <head>
        <title>Spec Sources</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        
        <img src="https://clubs-cu.s3.amazonaws.com/Spectator+Publishing+Logo.png" alt="image of spectator logo" width="263" height="55">

        <div class="main-container">
            <h1>Spectator's Sources</h1>

            <div class="source-form">
                <p class="input-text">Source Name:</p>
                <input type="text" class="input-box">
                <p class="input-text">Source Email:</p>
                <input type="text" class="input-box">
                <div class="add-button">
                    <h2 class="button-text">ADD</h2>
                </div>
            </div>

            <div class="sources-list">
                <div class="source-item">
                    <h2 class="item-number">1</h2>
                    <h2 class="item-source">Presbo</h2>
                    <h2 class="item-email">presbo@columbia.edu</h2>
                    <div class="del-button">
                        <h2 class="button-text">DELETE</h2>
                    </div>
                    

                </div>

                <div class="source-item">
                    <h2 class="item-number">2</h2>
                    <h2 class="item-source">John Jay Mouse</h2>
                    <h2 class="item-email">mouse@columbia.edu</h2>
                    <div class="del-button">
                        <h2 class="button-text">DELETE</h2>
                    </div>
                </div>

                <div class="source-item">
                    <h2 class="item-number">3</h2>
                    <h2 class="item-source">Water Bottle Man</h2>
                    <h2 class="item-email">flipper@columbia.edu</h2>
                    <div class="del-button">
                        <h2 class="button-text">DELETE</h2>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
</html>
